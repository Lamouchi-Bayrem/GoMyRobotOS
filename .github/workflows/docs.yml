name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build Sphinx site
        run: python -m sphinx -b html docs docs/_build/html
      - name: Verify build output
        run: test -f docs/_build/html/index.html

  schema:
    name: Validate contract examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml
      - name: Validate examples against schema
        run: |
          python - <<'EOF'
          import glob
          import json

          import jsonschema
          import yaml

          with open("schemas/partition-contract.schema.json") as fh:
              schema = json.load(fh)

          files = sorted(glob.glob("examples/*/flight-control.yml"))
          assert files, "no contract examples found under examples/"
          for path in files:
              with open(path) as fh:
                  doc = yaml.safe_load(fh)
              jsonschema.validate(doc, schema)
              print(f"OK  {path}")
          print(f"{len(files)} contract example(s) valid against schema")
          EOF
