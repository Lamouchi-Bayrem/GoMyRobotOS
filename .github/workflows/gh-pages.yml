name: gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Fires when the Pages infrastructure requests a redeploy (e.g. after
  # the site configuration changes). Aligned with GitHub's Pages template.
  pages-build-deployment:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build Sphinx site
        run: python -m sphinx -b html docs build/ghpages
      - name: Verify build output
        run: test -f build/ghpages/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/ghpages"

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
